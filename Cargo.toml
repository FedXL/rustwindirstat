[package]
name = "windirstat-rs"
version = "1.0.0"
edition = "2024"
description = "Fast Windows disk usage analyzer with an NTFS MFT fast path"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
walkdir = "2.5"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[target.'cfg(windows)'.dependencies]
ntfs-reader = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
